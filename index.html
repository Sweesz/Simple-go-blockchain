<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chain</title>
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>

    <header class="header">
        <div class="header-content">
            <div class="logo">Chain</div>
            <div class="stats">
                <div class="stat-card">
                    <span class="stat-label">Blocks</span>
                    <span class="stat-value" id="blockCount">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Records</span>
                    <span class="stat-value" id="txCount">0</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="transaction-form">
            <h2 class="form-title">New Record</h2>
            <div class="form-group">
                <input type="text" id="from" class="form-input" placeholder="Author / Sender ID">

                <div style="display: flex; gap: 10px; width: 100%;">
                    <input type="text" id="type" class="form-input" placeholder="Content / Data">
                    
                    <input type="file" id="fileInput" style="display: none;" onchange="blockchainApp.handleFileSelect(this)">
                    
                    <button class="btn" style="background: #21262d; border: 1px solid #30363d; color: #c9d1d9;" onclick="document.getElementById('fileInput').click()">
                        File
                    </button>
                </div>
            </div>
            
            <div id="fileStatus" style="font-size: 12px; color: #8b949e; margin-bottom: 15px; display: none;">
                File: <span id="fileName"></span> (<span id="fileSize"></span>)
            </div>

            <button class="btn btn-primary" onclick="blockchainApp.addTransaction(event)">
                Submit Record
            </button>
        </section>

        <section class="blockchain-view">
            <div id="blockchain" class="chain-container">
                <div class="loading">
                    <div class="spinner"></div>
                    Connecting to node...
                </div>
            </div>
        </section>
    </main>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="blockchainApp.closeModal()">&times;</span>
            <div class="modal-header">Block Details</div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="./static/js/main.js"></script>
</body>
</html>
